
# Publicación automática del Inventario MOPT
name: Publicar Inventario MOPT

# Ejecutar cuando se actualice la rama main
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos necesarios para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evitar publicaciones simultáneas
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Descargar los archivos del repositorio
      - name: Obtener archivos
        uses: actions/checkout@v4

      # Configurar GitHub Pages
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # Verificar que exista el sitio compilado
      - name: Verificar carpeta dist
        run: test -f dist/index.html

      # Preparar los archivos para publicación
      - name: Preparar aplicación
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # Publicar la aplicación
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
